<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crown Payment Link Router</title>
  <style>
    /* This is the small loading/error page agents see before redirect. */
    body {
      background-color: #fff4ec;
      color: #000;
      font-family: "Times New Roman", Times, serif;
      margin: 0;
      padding: 24px;
      text-align: center;
    }

    h1 {
      font-size: 22px;
      margin: 0 0 12px;
    }

    p {
      font-size: 16px;
      margin: 8px 0;
    }

    pre {
      background: #fff;
      border: 1px solid #999;
      display: inline-block;
      max-width: 100%;
      overflow: auto;
      padding: 12px;
      text-align: left;
      white-space: pre-wrap;
    }
  </style>
  <!-- payment-links.config.js contains the camp names and processor URLs. -->
  <script src="payment-links.config.js" defer></script>
  <!-- payment-router.js does the automatic camp detection and redirect. -->
  <script src="payment-router.js" defer></script>
</head>
<body>
  <h1>Loading Payment Link...</h1>
  <p id="router-status">Detecting campaign from list description.</p>
</body>
</html>
