<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crown Payment Links</title>
  <style>
    /* This backup page lists every configured camp and payment processor link. */
    body {
      background-color: #fff4ec;
      color: #000;
      font-family: "Times New Roman", Times, serif;
      margin: 0;
      padding: 24px;
    }

    main {
      margin: 0 auto;
      max-width: 980px;
    }

    h1,
    p {
      text-align: center;
    }

    table {
      background: #fff;
      border-collapse: collapse;
      width: 100%;
    }

    th,
    td {
      border: 1px solid #999;
      padding: 8px 10px;
      text-align: left;
      vertical-align: top;
    }

    th {
      background: #f2d4bf;
    }

    .missing {
      color: #8a1f11;
      font-weight: bold;
    }
  </style>
  <!-- Same generated config used by the automatic router. -->
  <script src="payment-links.config.js" defer></script>
  <!-- Builds the table of processor links below. -->
  <script src="payment-directory.js" defer></script>
</head>
<body>
  <main>
    <h1>Payment Processor Links</h1>
    <p>Select the correct camp below.</p>
    <table>
      <thead>
        <tr>
          <th>Camp</th>
          <th>Abbrev</th>
          <th>Payment Link</th>
        </tr>
      </thead>
      <tbody id="payment-link-list">
        <tr>
          <td colspan="3">Loading payment links...</td>
        </tr>
      </tbody>
    </table>
  </main>
</body>
</html>
